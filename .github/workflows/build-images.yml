name: Build and Push Container Images

on:
  push:
    branches: [ build ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set IMAGE_NAME for GHCR
      shell: bash
      run: echo "IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker meta for bluesky
      id: meta-bluesky
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/bluesky
        tags: |
          type=raw,value=build

    - name: Build and push bluesky image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./images/bluesky/Containerfile
        push: true
        tags: ${{ steps.meta-bluesky.outputs.tags }}
        labels: ${{ steps.meta-bluesky.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Docker meta for queueserver
      id: meta-queueserver
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/queueserver
        tags: |
          type=raw,value=build

    - name: Build and push queueserver image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./images/queueserver/Containerfile
        push: true
        tags: ${{ steps.meta-queueserver.outputs.tags }}
        labels: ${{ steps.meta-queueserver.outputs.labels }}
        build-args: |
          BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/bluesky:build
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Docker meta for gui
      id: meta-gui
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/gui
        tags: |
          type=raw,value=build

    - name: Build and push gui image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./images/gui/Containerfile
        push: true
        tags: ${{ steps.meta-gui.outputs.tags }}
        labels: ${{ steps.meta-gui.outputs.labels }}
        build-args: |
          BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/bluesky:build
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Docker meta for viewer
      id: meta-viewer
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/viewer
        tags: |
          type=raw,value=build

    - name: Build and push viewer image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./images/viewer/Containerfile
        push: true
        tags: ${{ steps.meta-viewer.outputs.tags }}
        labels: ${{ steps.meta-viewer.outputs.labels }}
        build-args: |
          BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/bluesky:build
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Docker meta for sim
      id: meta-sim
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/sim
        tags: |
          type=raw,value=build

    - name: Build and push sim image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./images/sim/Containerfile
        push: true
        tags: ${{ steps.meta-sim.outputs.tags }}
        labels: ${{ steps.meta-sim.outputs.labels }}
        build-args: |
          BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/bluesky:build
        cache-from: type=gha
        cache-to: type=gha,mode=max
