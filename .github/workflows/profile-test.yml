name: NBS Pods Profile Testing

on:
  pull_request:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "NBS_IMAGE_TAG override (e.g. build, latest)"
        required: false
        default: ""

jobs:
  pods-smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true

      - name: Select image tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            TAG="${{ inputs.image_tag }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TAG="build"
          else
            TAG="latest"
          fi
          echo "NBS_IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Using NBS_IMAGE_TAG=${TAG}"

      - name: Pods CLI smoke test
        shell: bash
        run: |
          set -euo pipefail

          pixi run nbs-pods --help
          pixi run podman-compose --version || true

          pixi run list | tee pods-list.txt
          grep -q "Available services" pods-list.txt

      - name: Create child pods package
        shell: bash
        run: |
          set -euo pipefail

          CHILD_ROOT="${RUNNER_TEMP}/child-pods"
          mkdir -p "${CHILD_ROOT}"
          pixi run create cispike "${CHILD_ROOT}" --no-git
          CHILD_DIR="${CHILD_ROOT}/cispike-pods"

          test -f "${CHILD_DIR}/pyproject.toml"
          test -f "${CHILD_DIR}/src/cispike_pods/deploy.py"
          test -f "${CHILD_DIR}/src/cispike_pods/config/ipython/profile_default/startup/beamline.toml"
          test -f "${CHILD_DIR}/src/cispike_pods/config/ipython/profile_default/startup/devices.toml"
          if grep -q '${BEAMLINE_NAME}' "${CHILD_DIR}/pyproject.toml"; then
            echo "Unresolved \${BEAMLINE_NAME} placeholder in child pyproject.toml" >&2
            exit 1
          fi

          python3 - <<PY
          from pathlib import Path

          child_dir = Path("${CHILD_DIR}")
          workspace = Path("${{ github.workspace }}").resolve()
          pyproject = child_dir / "pyproject.toml"
          text = pyproject.read_text(encoding="utf-8")
          old = 'nbs-pods = { git = "https://github.com/xraygui/nbs-pods.git"}'
          new = f'nbs-pods = {{ path = "{workspace}", editable = true }}'
          if old not in text:
              raise SystemExit(f"expected git nbs-pods dependency not found in {pyproject}")
          pyproject.write_text(text.replace(old, new, 1), encoding="utf-8")
          print(f"Rewrote nbs-pods dependency to path={workspace}")
          PY

          echo "CHILD_DIR=${CHILD_DIR}" >> "$GITHUB_ENV"

      - name: Install and smoke-test child CLI
        shell: bash
        run: |
          set -euo pipefail

          cd "${CHILD_DIR}"
          pixi install
          pixi run list | tee child-list.txt
          grep -q "Available services" child-list.txt

      - name: Start bluesky-services
        shell: bash
        working-directory: ${{ env.CHILD_DIR }}
        run: |
          set -euo pipefail

          podman --version
          podman info --debug || true

          pixi run start --image-tag "${NBS_IMAGE_TAG}" bluesky-services

          for i in $(seq 1 60); do
            echo "wait_iter=${i}"
            timeout 10s podman ps --format '{{.Names}}' | tee podman-ps.txt
            if grep -q "bluesky-services_mongo" podman-ps.txt && grep -q "bluesky-services_kafka" podman-ps.txt; then
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for bluesky-services to be running." >&2
          podman ps -a || true
          podman logs --tail 200 $(podman ps -aq) || true
          exit 1

      - name: Start sim
        shell: bash
        working-directory: ${{ env.CHILD_DIR }}
        run: |
          set -euo pipefail

          pixi run start --image-tag "${NBS_IMAGE_TAG}" sim

          for _ in $(seq 1 60); do
            timeout 10s podman ps --format '{{.Names}}' | tee podman-ps.txt
            if grep -q "sim_sim" podman-ps.txt; then
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for sim to be running." >&2
          podman ps -a || true
          podman logs --tail 200 $(podman ps -aq) || true
          exit 1

      - name: Start queueserver test
        shell: bash
        working-directory: ${{ env.CHILD_DIR }}
        run: |
          set -euo pipefail

          pixi run start --image-tag "${NBS_IMAGE_TAG}" --test --teardown queueserver

      - name: Tear down minimal pods
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CHILD_DIR:-}" && -d "${CHILD_DIR}" ]]; then
            (cd "${CHILD_DIR}" && pixi run stop queueserver sim bluesky-services) || true
          fi
          podman ps -a || true
