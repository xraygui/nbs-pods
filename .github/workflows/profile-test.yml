name: NBS Pods Profile Testing

on:
  pull_request:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  pods-smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true

      - name: Pods CLI smoke test
        shell: bash
        run: |
          set -euo pipefail

          pixi run nbs-pods -- --help
          pixi run podman-compose -- --version || true

          pixi run list | tee pods-list.txt
          grep -q "Available services" pods-list.txt

      - name: Start bluesky-services
        shell: bash
        run: |
          set -euo pipefail

          podman --version
          podman info --debug || true

          pixi run start -- bluesky-services

          for i in $(seq 1 60); do
            echo "wait_iter=${i}"
            timeout 10s podman ps --format '{{.Names}}' | tee podman-ps.txt
            if grep -q "bluesky-services_mongo" podman-ps.txt && grep -q "bluesky-services_kafka" podman-ps.txt; then
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for bluesky-services to be running." >&2
          podman ps -a || true
          podman logs --tail 200 $(podman ps -aq) || true
          exit 1

      - name: Start sim
        shell: bash
        run: |
          set -euo pipefail

          pixi run start -- sim

          for _ in $(seq 1 60); do
            timeout 10s podman ps --format '{{.Names}}' | tee podman-ps.txt
            if grep -q "sim_sim" podman-ps.txt; then
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for sim to be running." >&2
          podman ps -a || true
          podman logs --tail 200 $(podman ps -aq) || true
          exit 1

      - name: Start queueserver test
        shell: bash
        run: |
          set -euo pipefail

          pixi run start -- --test queueserver

      - name: Tear down minimal pods
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          pixi run stop -- queueserver sim bluesky-services || true
          podman ps -a || true
